name: Deploy Astro to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect package manager
        run: |
          if [ -f "package-lock.json" ]; then echo "manager=npm" >> $GITHUB_ENV; echo "command=ci" >> $GITHUB_ENV; exit 0
          elif [ -f "yarn.lock" ]; then echo "manager=yarn" >> $GITHUB_ENV; echo "command=install" >> $GITHUB_ENV; exit 0
          elif [ -f "pnpm-lock.yaml" ]; then echo "manager=pnpm" >> $GITHUB_ENV; echo "command=install:frozen" >> $GITHUB_ENV; exit 0
          else echo "Unable to determine packager manager"; exit 1
          fi
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ env.manager }}
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Install dependencies
        run: ${{ env.manager }} ${{ env.command }}
      - name: Build with Astro
        run: |
          # If you use a subpath/repo name instead of root domain, add --base=/repo-name
          npx astro build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ultimates # or ubuntu-latest
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions-gh-pages/deploy-action@v4 # Note: standard github pages action below uses actions/deploy-pages@v4
        uses: actions/deploy-pages@v4